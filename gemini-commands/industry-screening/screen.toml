prompt = """
<purpose>Invoke the industry-screening-orchestrator to perform top-down sector-to-company screening. Identifies the most attractive sectors, drills into sub-industries, screens all public companies in the selected industry, and produces a ranked watchlist of the most promising stocks.</purpose>

<usage>/industry-screening:screen [SECTOR|all|theme] [--horizon long|mid|short] [--min-cap VALUE] [--top N]</usage>

<agent-team>
This command uses the following sub-agents defined in the agents/ directory. Delegate screening phases to them — NEVER perform deep screening directly:

| Agent | Phases | Delegate When |
|-------|--------|---------------|
| @sector-screener | 1, 2 | Sector ranking, sub-industry deep-dive analysis |
| @company-screener | 3 | Company filtering, scoring, and ranking within an industry |
| @search-agent | All | Financial web search when screener agents need data |

Parallel execution rules (max 3 concurrent):
- Phase 1: Up to 3 @sector-screener agents in parallel (sector batches)
- Phase 2: Up to 2 @sector-screener agents in parallel (deep-dive on top sectors)
- Phase 3: 1-2 @company-screener agents (normal or split by market cap tier)
- Phase 4: Orchestrator synthesizes directly
</agent-team>

<process>
  <step n="1" name="Setup">Determine screening scope (all sectors / specific sector / theme), investment horizon, fetch macro context via fetch_macro.py, create output directory ./reports/screening/</step>
  <step n="2" name="Sector Screening">Delegate to @sector-screener agents to analyze and rank sectors by composite score (growth, profitability, valuation, macro fit, innovation, regulation, capital flows)</step>
  <step n="3" name="Industry Deep Dive">For top 2-3 sectors, delegate to @sector-screener agents in deep-dive mode. Drill into sub-industries: competitive dynamics, growth catalysts, TAM, key players, industry life cycle. Select the single best industry.</step>
  <step n="4" name="Company Screening">Delegate to @company-screener agents for the selected industry. Apply quantitative filters (market cap, growth, FCF, ROIC, leverage), score on multi-factor composite, produce ranked watchlist of top 10-20 companies.</step>
  <step n="5" name="Report Generation">Synthesize all phase summaries into screening report: macro context, sector ranking, industry deep-dive, company watchlist, next actions, risks to thesis.</step>
  <step n="6" name="Handoff">Offer to deep-dive top watchlist picks with @stock-analyst. The screening report's macro context and industry thesis feed directly into stock-analysis Stages 4 and 3.</step>
</process>

<constraints>
  <constraint>NEVER perform deep screening directly — always delegate to specialist sub-agents</constraint>
  <constraint>Use weighted composite scoring with methodology stated in report</constraint>
  <constraint>At least 10 companies must pass filters for a valid watchlist (flag if fewer)</constraint>
  <constraint>Macro data within 30 days freshness; sector data within 90 days</constraint>
  <constraint>All reports saved to ./reports/screening/[SECTOR]_[INDUSTRY]_[YYYY-MM-DD].md</constraint>
  <constraint>Context eviction enforced after each phase completion</constraint>
  <constraint>Offer stock-analysis deep-dive on top watchlist picks after report delivery</constraint>
</constraints>

User request: {{args}}
"""